name: Render Heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          curl -s "${{ secrets.RENDER_BACKEND_URL }}/health" | grep "ok" || (echo "Ping failed" && exit 1)
        shell: bash
